<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TIDEKEEPER 潮汐守望者 · Pixi 版</title>
<meta name="description" content="切換滿潮與乾潮的橫向平台動作遊戲（PixiJS v8：DisplacementFilter 水下折射、自寫 god rays 與潮汐震波 Filter）">
<meta name="theme-color" content="#7c6cff">
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #02101f; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas#game { display: block; position: fixed; inset: 0; }
  #touch { position: fixed; inset: 0; pointer-events: none; font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
  #touch[hidden] { display: none; }
  #touch .stick, #touch .btn { pointer-events: auto; touch-action: none; position: absolute; border-radius: 50%; }
  #touch .stick { left: max(16px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom)); width: 128px; height: 128px;
    background: rgba(124, 108, 255, 0.12); border: 2px solid rgba(124, 108, 255, 0.55); }
  #touch .knob { position: absolute; left: 36px; top: 36px; width: 56px; height: 56px; border-radius: 50%; background: rgba(124, 108, 255, 0.55); }
  #touch .btn { width: 64px; height: 64px; display: grid; place-items: center; color: #e8fbff; font-weight: 800; font-size: 20px;
    background: rgba(124, 108, 255, 0.28); border: 2px solid rgba(58, 214, 255, 0.6); }
  #touch .btn.on { background: rgba(58, 214, 255, 0.6); }
  #touch .b-jump { right: max(16px, env(safe-area-inset-right)); bottom: 24px; width: 76px; height: 76px; }
  #touch .b-atk { right: calc(max(16px, env(safe-area-inset-right)) + 86px); bottom: 20px; }
  #touch .b-tide { right: calc(max(16px, env(safe-area-inset-right)) + 40px); bottom: 110px; background: rgba(58, 214, 255, 0.25); }
  #touch .b-pause { left: 50%; transform: translateX(-50%); bottom: 24px; width: 46px; height: 46px; font-size: 16px; }
  #rotate { position: fixed; left: 50%; top: 42%; transform: translateX(-50%); padding: 8px 14px; border-radius: 10px; background: rgba(4, 16, 34, 0.8);
    color: #e8fbff; font: 600 14px "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; pointer-events: none; }
  #rotate[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="game" aria-label="TIDEKEEPER 遊戲畫面"></canvas>
<div id="touch" hidden>
  <div class="stick"><div class="knob"></div></div>
  <div class="btn b-jump" data-act="jump">跳</div>
  <div class="btn b-atk" data-act="attack">刺</div>
  <div class="btn b-tide" data-act="tide">潮</div>
  <div class="btn b-pause" data-act="pause">⏸</div>
</div>
<div id="rotate" hidden>橫向畫面更好玩 ↻</div>
<script type="importmap">{ "imports": { "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.mjs" } }</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
